<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Vazirmatn Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">

<title>3D Periodic Table</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Vazirmatn", Arial, Tahoma, sans-serif;
}


/* =====================================================
   BODY
===================================================== */

body {

    background: #000;

    color: #fff;

    font-family:
        "Vazirmatn",
        Arial,
        Tahoma,
        sans-serif;

    min-height: 100vh;

    overflow-x: hidden;

    transition:
        direction .3s ease;

}


/* =====================================================
   LANGUAGE SWITCHER
===================================================== */

.language-switcher {

    position: fixed;

    top: 20px;

    right: 25px;

    z-index: 1000;

    display: flex;

    gap: 6px;

    padding: 5px;

    border: 1px solid #444;

    background: rgba(0,0,0,.9);

    backdrop-filter: blur(10px);
}


body[dir="rtl"] .language-switcher {

    right: auto;

    left: 25px;

}


.language-btn {

    background: transparent;

    color: #888;

    border: 1px solid transparent;

    padding: 8px 13px;

    cursor: pointer;

    font-size: 12px;

    transition: .25s;

}


.language-btn:hover {

    color: white;

    border-color: #555;

}


.language-btn.active {

    background: white;

    color: black;

}


/* =====================================================
   HEADER
===================================================== */

header {

    text-align: center;

    padding:
        90px
        20px
        30px;

}


header h1 {

    font-size:
        clamp(
            34px,
            5vw,
            65px
        );

    font-weight: 300;

    letter-spacing: 5px;

}


body[dir="rtl"] header h1 {

    letter-spacing: 1px;

}


header p {

    margin-top: 15px;

    color: #888;

    font-size: 13px;

    letter-spacing: 3px;

}


body[dir="rtl"] header p {

    letter-spacing: 1px;

}


/* =====================================================
   PERIODIC TABLE CONTAINER
===================================================== */

.periodic-container {

    width: 96%;

    max-width: 1600px;

    margin: 25px auto;

    padding: 25px;

    overflow-x: auto;

}


/* =====================================================
   PERIODIC TABLE
===================================================== */

.periodic-table {

    display: grid;

    grid-template-columns:
        repeat(
            18,
            minmax(
                65px,
                1fr
            )
        );

    grid-auto-rows: 90px;

    gap: 7px;

    min-width: 1200px;

}


/* =====================================================
   ELEMENT
===================================================== */

.element {

    position: relative;

    border:
        1px solid #555;

    background: #080808;

    color: white;

    cursor: pointer;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    transition:
        transform .25s ease,
        background .25s ease,
        color .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;

}


.element:hover {

    transform:
        translateY(-7px)
        scale(1.05);

    background: white;

    color: black;

    border-color: white;

    box-shadow:
        0 15px 35px
        rgba(
            255,
            255,
            255,
            .15
        );

    z-index: 10;

}


.element .number {

    position: absolute;

    top: 7px;

    left: 8px;

    font-size: 10px;

    opacity: .7;

}


.element .symbol {

    font-size: 25px;

    font-weight: bold;

    direction: ltr;

}


.element .name {

    font-size: 10px;

    margin-top: 6px;

    text-align: center;

    white-space: nowrap;

}


.element .mass {

    font-size: 8px;

    margin-top: 4px;

    color: #888;

    direction: ltr;

}


.element:hover .mass {

    color: #333;

}


/* =====================================================
   3D SECTION
===================================================== */

.viewer-section {

    width: 100%;

    min-height: 700px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    padding: 80px 20px;

    border-top:
        1px solid #222;

    margin-top: 40px;

    perspective: 1200px;

}


.viewer-title {

    color: #777;

    font-size: 13px;

    letter-spacing: 2px;

    margin-bottom: 45px;

}


body[dir="rtl"] .viewer-title {

    letter-spacing: 1px;

}


/* =====================================================
   3D SCENE
===================================================== */

.scene {

    width: 330px;

    height: 430px;

    perspective: 1200px;

}


/* =====================================================
   CARD
===================================================== */

.card {

    width: 100%;

    height: 100%;

    position: relative;

    transform-style: preserve-3d;

    transition:
        transform .8s
        cubic-bezier(
            .2,
            .8,
            .2,
            1
        );

    cursor: pointer;

}


/* =====================================================
   FRONT
===================================================== */

.card-front {

    position: absolute;

    width: 100%;

    height: 100%;

    background:
        linear-gradient(
            145deg,
            #fff,
            #ddd
        );

    color: #000;

    border:
        3px solid white;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    backface-visibility: hidden;

    box-shadow:
        20px 20px 0 #333,
        35px 35px 50px
        rgba(
            255,
            255,
            255,
            .08
        );

}


.card-front::before {

    content: "";

    position: absolute;

    inset: 12px;

    border:
        1px solid #777;

    pointer-events: none;

}


/* =====================================================
   BIG NUMBER
===================================================== */

.big-number {

    position: absolute;

    top: 30px;

    left: 35px;

    font-size: 18px;

    direction: ltr;

}


body[dir="rtl"] .big-number {

    left: auto;

    right: 35px;

}


/* =====================================================
   BIG SYMBOL
===================================================== */

.big-symbol {

    font-size: 120px;

    line-height: 1;

    font-weight: 800;

    letter-spacing: -5px;

    direction: ltr;

}


/* =====================================================
   BIG NAME
===================================================== */

.big-name {

    margin-top: 20px;

    font-size: 28px;

    font-weight: 500;

    letter-spacing: 2px;

    text-align: center;

}


body[dir="rtl"] .big-name {

    letter-spacing: 1px;

}


/* =====================================================
   BIG MASS
===================================================== */

.big-mass {

    margin-top: 12px;

    font-size: 15px;

    color: #444;

}


/* =====================================================
   CARD BACK
===================================================== */

.card-back {

    position: absolute;

    width: 100%;

    height: 100%;

    background: #111;

    color: white;

    border:
        3px solid white;

    transform:
        rotateY(180deg);

    backface-visibility: hidden;

    display: flex;

    justify-content: center;

    align-items: center;

    text-align: center;

}


.card-back-content {

    padding: 30px;

}


.card-back h2 {

    font-size: 80px;

    margin-bottom: 25px;

    direction: ltr;

}


.card-back p {

    color: #aaa;

    line-height: 2;

    font-size: 15px;

}


/* =====================================================
   INFORMATION
===================================================== */

.info {

    margin-top: 65px;

    display: flex;

    gap: 35px;

    text-align: center;

}


.info-box {

    min-width: 140px;

    border-top:
        1px solid #444;

    padding-top: 13px;

}


.info-box span {

    display: block;

    color: #777;

    font-size: 11px;

    margin-bottom: 9px;

}


.info-box strong {

    font-size: 20px;

    direction: ltr;

    display: block;

}


/* =====================================================
   FOOTER
===================================================== */

footer {

    border-top:
        1px solid #222;

    text-align: center;

    padding: 35px 20px;

    color: #666;

    font-size: 12px;

    line-height: 2;

}


.creator {

    color: #aaa;

    font-size: 14px;

    margin-top: 8px;

}


/* =====================================================
   SCROLLBAR
===================================================== */

::-webkit-scrollbar {

    width: 8px;

    height: 8px;

}


::-webkit-scrollbar-track {

    background: #050505;

}


::-webkit-scrollbar-thumb {

    background: #444;

}


::-webkit-scrollbar-thumb:hover {

    background: #777;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    header h1 {

        font-size: 32px;

    }


    .scene {

        width: 280px;

        height: 370px;

    }


    .big-symbol {

        font-size: 90px;

    }


    .big-name {

        font-size: 21px;

    }


    .info {

        gap: 12px;

    }


    .info-box {

        min-width: 95px;

    }


    .language-switcher {

        top: 12px;

        right: 12px;

    }


    body[dir="rtl"] .language-switcher {

        left: 12px;

        right: auto;

    }

}

</style>

</head>

/* =====================================================
   TRANSLATIONS
===================================================== */

const translations = {

    en: {

        title:
            "Periodic Table",

        subtitle:
            "THE 118 ELEMENTS OF THE PERIODIC TABLE",

        viewer:
            "SELECT AN ELEMENT",

        number:
            "ATOMIC NUMBER",

        symbol:
            "SYMBOL",

        mass:
            "ATOMIC MASS",

        atomicMass:
            "Atomic Mass",

        description:
            "is element number",

        descriptionEnd:
            "in the periodic table.",

        footer:
            "118 ELEMENTS · CLASSIC BLACK & WHITE · 3D PERIODIC TABLE",

        creator:
            "Created by Mohammad Sadra Bazargan"

    },


    fa: {

        title:
            "جدول تناوبی عناصر",

        subtitle:
            "۱۱۸ عنصر جدول تناوبی",

        viewer:
            "یک عنصر را انتخاب کنید",

        number:
            "عدد اتمی",

        symbol:
            "نماد",

        mass:
            "جرم اتمی",

        atomicMass:
            "جرم اتمی",

        description:
            "عنصر شماره",

        descriptionEnd:
            "در جدول تناوبی است.",

        footer:
            "۱۱۸ عنصر · جدول تناوبی کلاسیک سیاه و سفید · نمایش سه‌بعدی",

        creator:
            "ساخته شده توسط محمد صدرا بازرگان"

    }

};


/* =====================================================
   DOM ELEMENTS
===================================================== */

const table =
    document.getElementById(
        "periodicTable"
    );

const card =
    document.getElementById(
        "card"
    );

const title =
    document.getElementById(
        "title"
    );

const subtitle =
    document.getElementById(
        "subtitle"
    );

const viewerTitle =
    document.getElementById(
        "viewerTitle"
    );

const bigNumber =
    document.getElementById(
        "bigNumber"
    );

const bigSymbol =
    document.getElementById(
        "bigSymbol"
    );

const bigName =
    document.getElementById(
        "bigName"
    );

const bigMass =
    document.getElementById(
        "bigMass"
    );

const backSymbol =
    document.getElementById(
        "backSymbol"
    );

const backText =
    document.getElementById(
        "backText"
    );

const infoNumber =
    document.getElementById(
        "infoNumber"
    );

const infoSymbol =
    document.getElementById(
        "infoSymbol"
    );

const infoMass =
    document.getElementById(
        "infoMass"
    );

const numberLabel =
    document.getElementById(
        "numberLabel"
    );

const symbolLabel =
    document.getElementById(
        "symbolLabel"
    );

const massLabel =
    document.getElementById(
        "massLabel"
    );

const footerText =
    document.getElementById(
        "footerText"
    );

const creator =
    document.getElementById(
        "creator"
    );

const enBtn =
    document.getElementById(
        "enBtn"
    );

const faBtn =
    document.getElementById(
        "faBtn"
    );


/* =====================================================
   CURRENT LANGUAGE
===================================================== */

let currentLanguage = "en";

let selectedElement =
    elements[0];

let rotated = false;


/* =====================================================
   CREATE TABLE
===================================================== */

function createTable() {

    table.innerHTML = "";


    elements.forEach(
        element => {

            const box =
                document.createElement(
                    "div"
                );


            box.classList.add(
                "element"
            );


            box.style.gridColumn =
                element.group;


            box.style.gridRow =
                element.period;


            box.innerHTML = `

                <div class="number">
                    ${element.number}
                </div>

                <div class="symbol">
                    ${element.symbol}
                </div>

                <div class="name">
                    ${element[currentLanguage]}
                </div>

                <div class="mass">
                    ${element.mass}
                </div>

            `;


            box.addEventListener(
                "click",
                () => {

                    showElement(
                        element
                    );

                }
            );


            table.appendChild(
                box
            );

        }
    );

}


/* =====================================================
   SHOW ELEMENT
===================================================== */

function showElement(element) {

    selectedElement =
        element;


    const name =
        element[currentLanguage];


    bigNumber.textContent =
        element.number;


    bigSymbol.textContent =
        element.symbol;


    bigName.textContent =
        name;


    if (
        currentLanguage === "fa"
    ) {

        bigMass.textContent =
            "جرم اتمی: " +
            element.mass;

    }

    else {

        bigMass.textContent =
            "Atomic Mass: " +
            element.mass;

    }


    backSymbol.textContent =
        element.symbol;


    if (
        currentLanguage === "fa"
    ) {

        backText.textContent =
            `${name} عنصر شماره ${element.number} در جدول تناوبی است.`;

    }

    else {

        backText.textContent =
            `${name} is element number ${element.number} in the periodic table.`;

    }


    infoNumber.textContent =
        element.number;


    infoSymbol.textContent =
        element.symbol;


    infoMass.textContent =
        element.mass;


    rotated = false;


    card.style.transform =
        "rotateY(0deg)";


    document
        .querySelector(
            ".viewer-section"
        )
        .scrollIntoView({

            behavior:
                "smooth",

            block:
                "center"

        });

}


/* =====================================================
   CHANGE LANGUAGE
===================================================== */

function changeLanguage(language) {

    currentLanguage =
        language;


    const t =
        translations[
            language
        ];


    document.documentElement.lang =
        language;


    document.body.dir =
        language === "fa"
            ? "rtl"
            : "ltr";


    title.textContent =
        t.title;


    subtitle.textContent =
        t.subtitle;


    viewerTitle.textContent =
        t.viewer;


    numberLabel.textContent =
        t.number;


    symbolLabel.textContent =
        t.symbol;


    massLabel.textContent =
        t.mass;


    footerText.textContent =
        t.footer;


    creator.textContent =
        t.creator;


    enBtn.classList.toggle(
        "active",
        language === "en"
    );


    faBtn.classList.toggle(
        "active",
        language === "fa"
    );


    createTable();


    showElement(
        selectedElement
    );

}


/* =====================================================
   CARD ROTATION
===================================================== */

card.addEventListener(
    "click",
    () => {

        rotated =
            !rotated;


        if (rotated) {

            card.style.transform =
                "rotateY(180deg)";

        }

        else {

            card.style.transform =
                "rotateY(0deg)";

        }

    }
);


/* =====================================================
   INITIALIZE
===================================================== */

createTable();

showElement(
    elements[0]
);

</script>
